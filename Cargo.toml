[package]
name = "vyges-par"
version = "0.1.46"
edition = "2021"
description = "Hypergraph partitioning: multilevel coarsening, initial partitioning and refinement, with small exact ILP solves."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/par"

[features]
# `par-stage`: a developer tool that replays recorded partitioning calls (JSON lines) and prints
# the trace. Not installed or released; this crate is a library.
cli = ["dep:serde_json"]
# The exact (ILP) partition through the pinned solver library (Linux x86_64 and arm64). Without it the
# stages that need an exact solve are refused.
ilp = ["dep:vyges-ortools-lib"]

[dependencies]
serde_json = { version = "1", optional = true }
vyges-ortools-lib = { git = "https://github.com/vyges-tools/ortools-lib", branch = "main", optional = true }

# Local development against the sibling checkout. Patches are only honored from the root
# manifest, so this is a no-op for downstream consumers pulling us by git.
[patch."https://github.com/vyges-tools/ortools-lib"]
vyges-ortools-lib = { path = "../vyges-tools-ortools-lib" }

[lib]
name = "vyges_par"

[[bin]]
name = "par-stage"
required-features = ["cli"]

[[example]]
name = "seed_probe"
required-features = ["cli"]
